<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CrossLinks library</title>
    <link rel="icon" href="icons/icon-32.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="app">
    <aside class="sidebar">
      <div class="brand"><img src="icons/icon-48.png" alt=""><span class="wordmark">crosslinks</span></div>
      <div>
        <p class="eyebrow" style="padding: 0 10px 8px">Lists</p>
        <nav id="lists" aria-label="Lists"></nav>
      </div>
      <form id="new-list" class="row">
        <input id="new-list-name" required maxlength="60" placeholder="New list" aria-label="New list name">
        <button class="icon-btn" type="submit" aria-label="Add list" title="Add list" id="add-list"></button>
      </form>
      <p class="sync-note" id="sync-note">Synced with your Chrome profile</p>
    </aside>
    <main class="content">
      <div class="content-head">
        <div>
          <h1 id="list-title">All articles</h1>
          <form id="rename-form" hidden>
            <input id="rename-input" required maxlength="60" aria-label="List name">
            <button class="primary" type="submit">Save</button>
            <button id="rename-cancel" type="button">Cancel</button>
          </form>
          <p id="list-meta" class="muted"></p>
        </div>
        <div class="row">
          <button id="export-library" class="ghost" type="button">Export</button>
          <button id="import-library" class="ghost" type="button">Import</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
          <button id="rename-list" class="ghost" type="button" hidden>Rename</button>
          <button id="delete-list" class="ghost danger" type="button" hidden>Delete</button>
        </div>
      </div>
      <p id="library-status" role="status" aria-live="polite"></p>
      <div class="toolbar">
        <div class="segmented" id="filters">
          <button type="button" data-filter="unread" aria-pressed="true">Unread</button>
          <button type="button" data-filter="read" aria-pressed="false">Read</button>
          <button type="button" data-filter="all" aria-pressed="false">All</button>
        </div>
        <input id="search" type="search" placeholder="Search articles" aria-label="Search saved articles">
      </div>
      <ol id="articles" class="article-list"></ol>
    </main>
    <script type="module" src="library.js"></script>
  </body>
</html>
